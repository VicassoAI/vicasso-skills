name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-specifications:
    name: Validate Specifications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: validate-versions
        run: node scripts/validate-versions.mjs

      - name: validate-version-bumped
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/validate-versions.mjs --ahead-of-latest-tag

      - name: validate-skill-spec
        if: ${{ !cancelled() }}
        run: node scripts/validate-skill-spec.mjs

      - name: validate-plugin-spec
        if: ${{ !cancelled() }}
        run: node scripts/validate-plugin-spec.mjs

  validate-claude:
    name: Validate Claude
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Unpinned on purpose: this job exists to catch the current CLI rejecting
      # what we ship, which a pin would hide.
      - name: Install the Claude Code CLI
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code

      - name: Validate the marketplace manifest
        run: claude plugin validate .

      - name: Validate each plugin and its skills
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          fail=0
          for plugin in plugins/*/; do
            echo "--- ${plugin}"
            claude plugin validate "${plugin}" || fail=1
          done
          exit "${fail}"
